<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazaki — YNA Test Portal Design Refactor</title>
  <style>
    :root {
      color-scheme: light;
      --teal: #008C95;
      --teal-light: #dff2f3;
      --teal-dark: #006870;
      --red: #ed1c24;
      --charcoal: #2B2B2B;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --border: #e2e4e8;
      --text: #1a1d25;
      --text-muted: #5a6070;
      --text-light: #8c95a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 3px solid var(--red);
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 0 48px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); }
    .brand span { color: var(--red); }
    .brand-divider { width: 1px; height: 20px; background: var(--border); }
    .brand-sub { font-size: 12px; color: var(--text-light); font-weight: 500; }
    .header-badge { margin-left: auto; background: var(--teal-light); color: var(--teal-dark); font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
    .hero { background: #fff; border-bottom: 1px solid var(--border); padding: 56px 48px 48px; }
    .hero-inner { max-width: 860px; margin: 0 auto; }
    .hero-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .hero-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--teal-light); }
    .hero h1 { font-size: 32px; font-weight: 700; color: var(--charcoal); line-height: 1.15; margin-bottom: 14px; }
    .hero h1 em { font-style: normal; color: var(--teal); }
    .hero-desc { font-size: 15px; color: var(--text-muted); max-width: 620px; line-height: 1.7; margin-bottom: 32px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
    .meta-item { font-size: 12px; color: var(--text-light); }
    .meta-item strong { display: block; font-size: 13px; color: var(--charcoal); margin-bottom: 1px; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-light); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 48px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s; }
    .card:hover { box-shadow: 0 8px 24px rgba(0,140,149,0.12); border-color: var(--teal); transform: translateY(-2px); }
    .card:hover .card-arrow { transform: translateX(4px); }
    .card-top { height: 5px; background: var(--teal); flex-shrink: 0; }
    .card-top.red { background: var(--red); }
    .card-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
